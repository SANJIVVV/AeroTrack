# Render Blueprint: one web service that serves the API and the plain HTML/CSS/JS client.
# Secrets are marked sync: false so they are entered in the Render dashboard, never committed.
services:
  - type: web
    name: aerotrack-pro
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SERVE_CLIENT
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: aerotrack_pro
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
